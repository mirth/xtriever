[package]
name = "xtriever-lexical"
description = "Xtriever: lexical stage — BM25 retrieval, metadata filters and corpus statistics over tantivy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roaring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "stopwords", "lz4-compression", "stemmer"] }
thiserror.workspace = true
xtriever-core = { path = "../xtriever-core" }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
