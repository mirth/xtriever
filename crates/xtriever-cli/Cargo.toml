[package]
name = "xtriever-cli"
description = "Xtriever: command-line tools (corpus builds)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
xtriever-analysis = { path = "../xtriever-analysis" }
xtriever-core = { path = "../xtriever-core" }
xtriever-dense = { path = "../xtriever-dense", features = ["mmap"] }
xtriever-ffi = { path = "../xtriever-ffi" }
xtriever-pipeline = { path = "../xtriever-pipeline", features = ["mmap"] }
xtriever-rerank = { path = "../xtriever-rerank", features = ["mmap"] }

[[bin]]
name = "xtriever"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
