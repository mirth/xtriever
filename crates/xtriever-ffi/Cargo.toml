[package]
name = "xtriever-ffi"
description = "Xtriever: Swift/iOS FFI. Spike code lives behind the non-default `spike` feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# `lib` is REQUIRED, not decorative: without an rlib, integration tests in `tests/`
# have nothing to link against and fail as *compile errors* rather than as test
# failures — which is exactly what FR-013's "committed failing" checkpoint forbids.
# It also breaks `cargo nextest run --workspace`.
# `staticlib` is what the iOS app links; `cdylib` is what uniffi-bindgen reads.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# All spike code sits behind this non-default feature (Constitution §III, FR-003).
spike = [
    "dep:tantivy",
    "dep:tokenizers",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:uniffi",
    "dep:serde_json",
    "dep:sha2",
]
# Bindings generation only; never enabled for a device build.
cli = ["dep:uniffi", "uniffi/cli"]
serde_json = ["dep:serde_json"]

[dependencies]
xtriever-core = { path = "../xtriever-core" }
thiserror.workspace = true

tantivy = { version = "0.26.2", default-features = false, features = [
    "mmap",
    "stopwords",
    "lz4-compression",
    "stemmer",
], optional = true }

tokenizers = { version = "0.23.2", default-features = false, features = [
    "fancy-regex",
], optional = true }

# PINNED to 0.9.2 — do NOT `cargo add`-upgrade. See docs/adr/0001-pin-candle-0-9-2.md.
# 0.10+ declare a non-optional `tokenizers` dependency with the `onig` feature hard-coded,
# pulling `onig_sys` (C), which deny.toml bans and no feature flag can disable. 0.11.0
# additionally needs nightly (`stdarch_neon_f16`) on every target where `target_feature=fp16`
# is on — which includes this host and the iOS simulator, breaking the macOS CI gate.
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
candle-transformers = { version = "0.9.2", optional = true }

uniffi = { version = "0.32.1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
anyhow = "1"
serde_json = "1"
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[example]]
name = "gen_ranking"
path = "examples/gen_ranking.rs"
required-features = ["spike"]

[lints]
workspace = true
