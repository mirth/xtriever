[package]
name = "xtriever-ffi"
description = "Xtriever: Swift/iOS FFI surface over the hybrid pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# `lib` is REQUIRED, not decorative: without an rlib, integration tests in `tests/`
# have nothing to link against and fail as *compile errors* rather than as test
# failures — which is exactly what the "committed failing" checkpoint forbids.
# It also breaks `cargo nextest run --workspace`.
# `staticlib` is what the iOS app links; `cdylib` is what uniffi-bindgen reads.
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Bindings generation only; never enabled for a device build.
cli = ["uniffi/cli"]

[dependencies]
xtriever-core = { path = "../xtriever-core" }
xtriever-pipeline = { path = "../xtriever-pipeline", features = ["mmap"] }
xtriever-dense = { path = "../xtriever-dense", features = ["mmap"] }
xtriever-rerank = { path = "../xtriever-rerank", features = ["mmap"] }
thiserror.workspace = true
uniffi = "0.32.1"

[dev-dependencies]
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[lints]
workspace = true
