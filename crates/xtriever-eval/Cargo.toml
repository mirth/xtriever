[package]
name = "xtriever-eval"
description = "Xtriever: BEIR evaluation harness — nDCG@10 and Recall@100 for any LexicalIndex, with pinned datasets and reference-verified metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror.workspace = true
xtriever-core = { path = "../xtriever-core" }

[lints]
workspace = true

[dev-dependencies]
anyhow = "1.0.104"
proptest = "1.11.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
# The example needs both load paths (research D12); the `mmap` feature is dev-only here.
xtriever-dense = { path = "../xtriever-dense", features = ["mmap"] }
xtriever-lexical = { path = "../xtriever-lexical" }
xtriever-pipeline = { path = "../xtriever-pipeline" }
xtriever-rerank = { path = "../xtriever-rerank", features = ["mmap"] }
