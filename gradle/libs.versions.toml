# Feature 025. Every version here was resolved from its repository's metadata on 2026-09-20,
# never written from memory (Principle VII): the Android Gradle Plugin and the AndroidX
# artefacts from Google's Maven repository, Kotlin and Java Native Access from Maven Central.
# `./gradlew :android:xtriever:dependencies` shows what they resolve to.

[versions]
agp = "9.4.1"                  # com.android.tools.build:gradle, latest release 2026-09-20
kotlin = "2.4.20"              # org.jetbrains.kotlin:kotlin-gradle-plugin
jna = "5.19.1"                 # net.java.dev.jna:jna — the generated bindings' runtime
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"     # newest stable; 1.14.0 is alpha
composeBom = "2026.09.00"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
# The generated Kotlin bindings call into the native library through Java Native Access; the
# `@aar` classifier is the Android build of it, which carries the native pieces JNA needs.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
# Kotlin support is built into the Android plugin since 9.0 — no kotlin-android entry.
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
