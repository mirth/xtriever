# Enforces Constitution §III (portability) and §VII (licenses). Extend as the spike surfaces deps.
[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0"]

[advisories]
yanked = "deny"
# RUSTSEC-2024-0436: `paste` is unmaintained (no CVE, proc-macro only). Reached solely via
# candle-core 0.9.2 -> gemm 0.19.0, candle's CPU matmul backend, so it is unavoidable while
# Principle I names candle as the default inference engine. ONE advisory id, deliberately not
# a blanket `unmaintained = "allow"`. Authorized 2026-09-11; review triggers in
# docs/adr/0004-ignore-rustsec-2024-0436.md.
ignore = ["RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"
# Native (C/C++) deps may only appear beneath explicitly named leaf crates.
deny = [
  { crate = "onig_sys" },                                            # tokenizers: use the fancy-regex feature
  { crate = "openssl-sys" },                                         # use rustls
  { crate = "ort-sys", wrappers = ["xtriever-dense", "xtriever-rerank"] },
]
