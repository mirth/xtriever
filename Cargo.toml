[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"

[workspace.dependencies]
# Core crates: pure Rust only (Constitution §III). Add deps with `cargo add`, never from memory.
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"          # opt in per module with #[allow(unsafe_code)] + `// SAFETY:` (dense SIMD only)
missing_docs = "warn"         # CI runs with -D warnings

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Feature 025: the Android library. Same reason as the wheel below — uniffi's metadata lives in
# the library's symbol table and `strip = true` removes it, so `uniffi-bindgen` finds nothing to
# read in a release `.so` (measured 2026-09-20: 0 `UNIFFI_META` symbols stripped, 30 unstripped).
# Debug info is still dropped; the stripped-of-debuginfo library is ~9 MB.
[profile.android]
inherits = "release"
strip = "debuginfo"

# Feature 011: the Python wheel's cdylib. uniffi's metadata lives in the library's symbol table;
# `strip = true` removes it on Linux (`uniffi-bindgen` then finds "No UniFFI metadata"), so the
# wheel keeps symbols and drops only debug info. Everything else is the release profile.
[profile.wheel]
inherits = "release"
strip = "debuginfo"
