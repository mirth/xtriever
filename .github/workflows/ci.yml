name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Feature 007 (first full Linux link of the FFI crate): the ubuntu runner has ~14 GB of disk
  # and the workspace test build filled it — lld writes its output through a memory-mapped
  # file, so the disk running out surfaced as `ld terminated with signal 7 [Bus error]` on
  # whichever test binary was linking at the time (xtriever-dense/model_pins). The workspace
  # has 69 test executables, ~35 of them linking candle + tantivy; on Linux each embeds the full
  # DWARF of that tree. Neither setting changes what is compiled, tested or linted:
  #   CARGO_INCREMENTAL=0        a fresh runner never reuses the incremental cache (800 MB of a
  #                              3.7 GB build locally; only ever adds time and disk here)
  #   CARGO_PROFILE_DEV_DEBUG    line-tables-only keeps file:line in panic backtraces and drops
  #                              the type/variable DWARF that dominates test-binary size
  # (`test` inherits from `dev`). If the disk is still short, the next lever is removing the
  # runner's unused preinstalled SDKs (/usr/share/dotnet, /usr/local/lib/android) — the
  # `df -h` step below is the evidence for that call.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, macos-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install            # reads rust-toolchain.toml
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest,cargo-deny" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo nextest run --workspace
      - run: df -h . && du -sh target
        if: runner.os == 'Linux'
      - run: cargo deny check
        if: runner.os == 'Linux'
  cross-check:                                    # Constitution §III — no linking, so no NDK/Xcode needed yet
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo check --workspace --target aarch64-apple-ios
      - run: cargo check --workspace --target aarch64-apple-ios-sim
      - run: cargo check --workspace --target aarch64-linux-android
      - run: cargo check --workspace --target wasm32-unknown-unknown
        continue-on-error: true                   # best-effort target
      # Feature 007: the FFI surface is xtriever-ffi's default feature set, so the workspace
      # checks above cover its iOS build. No simulator, device or model step runs in CI.
  # Feature 003: the constitution's "eval smoke (SciFact)" gate, blocking (spec FR-023; restores
  # the gate ADR-0006 deferred). Runs only when a ranking crate changes. SciFact is fetched into a
  # hash-verified cache keyed by the manifest's archive hash, so a cache hit downloads nothing and
  # every file is still re-verified by scripts/fetch-beir.sh and by the Rust loader.
  #
  # FR-023 escape hatch, verbatim: "if download or cache flakiness makes the job unreliable, it MAY
  # be demoted to non-blocking for one feature cycle only, by a commit that states the reason and
  # the commit at which it becomes blocking again." Demoting means adding `continue-on-error: true`
  # to the smoke step below WITH that statement in the same commit — never silently.
  eval-smoke:
    runs-on: ubuntu-latest
    # dorny/paths-filter lists a PR's changed files through the GitHub API on pull_request events
    # (on push it uses `git diff` and needs nothing). With the repository's restricted default
    # token this fails with "Resource not accessible by integration" unless the job is granted
    # pull-requests: read. contents: read is what checkout and the cache need.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ranking:
              - 'crates/xtriever-lexical/**'
              - 'crates/xtriever-dense/**'
              - 'crates/xtriever-rerank/**'
              - 'crates/xtriever-ltr/**'
              - 'crates/xtriever-pipeline/**'
              - 'crates/xtriever-eval/**'
              - 'reference/datasets/beir-manifest.json'
              - 'specs/003-eval-harness/baselines/**'
      - if: steps.filter.outputs.ranking == 'true'
        run: rustup toolchain install
      - if: steps.filter.outputs.ranking == 'true'
        uses: actions/cache@v4
        with:
          path: |
            reference/datasets/beir/scifact.zip
            reference/datasets/beir/scifact
          key: beir-scifact-${{ hashFiles('reference/datasets/beir-manifest.json') }}
      - if: steps.filter.outputs.ranking == 'true'
        run: ./scripts/fetch-beir.sh scifact
      - if: steps.filter.outputs.ranking == 'true'
        run: cargo run --release -p xtriever-eval --example beir -- smoke --dataset scifact --baseline specs/003-eval-harness/baselines/lexical-baseline-v1.scifact.json
  # Feature 011: the Python package. Builds the wheel on Linux with maturin (which runs the
  # crate's own `uniffi-bindgen` bin), installs it into a fresh interpreter and runs the
  # model-free subset of the suite. Standing rules: no model, no dataset, no macOS runner;
  # the model-backed tests (the 007 goldens, the builder) are a local obligation under Agent
  # Operating Rule 5. Budget: under 10 minutes (spec SC-006) — the release build of the FFI
  # cdylib and its tree is the cost, cached by rust-cache under its own key.
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'crates/xtriever-ffi/**'
              - 'python/**'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - if: steps.filter.outputs.python == 'true'
        run: rustup toolchain install
      - if: steps.filter.outputs.python == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: python-wheel
      - if: steps.filter.outputs.python == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - if: steps.filter.outputs.python == 'true'
        run: uv venv .venv && uv pip install "maturin>=1.15,<2" pytest
      - if: steps.filter.outputs.python == 'true'
        run: cd python && ../.venv/bin/maturin build --release
      - if: steps.filter.outputs.python == 'true'
        run: ls -la target/wheels && uv pip install target/wheels/xtriever-*.whl
      - if: steps.filter.outputs.python == 'true'
        run: .venv/bin/pytest python/tests -q -m "not models"
