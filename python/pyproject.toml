[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "xtriever"
dynamic = ["version"]
description = "Xtriever: hybrid retrieval for RAG (BM25 → dense → fusion → re-rank) — Python bindings over the Rust engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Text Processing :: Indexing",
]

# The module is generated by uniffi from the crate's exports through the crate's own
# `uniffi-bindgen` bin (Feature 011 research D2); nothing generated is committed.
[tool.maturin]
manifest-path = "../crates/xtriever-ffi/Cargo.toml"
bindings = "uniffi"
python-source = "src"
module-name = "xtriever._ffi"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the pinned models and the fixture index on disk (skipped otherwise)"]
